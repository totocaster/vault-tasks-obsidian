name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const tagName = process.env.TAG_NAME;
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));

          if (!/^\d+\.\d+\.\d+$/.test(tagName)) {
            throw new Error(`Release tags must be bare semver, received "${tagName}".`);
          }

          if (manifest.version !== tagName) {
            throw new Error(
              `Tag "${tagName}" must match manifest.json version "${manifest.version}".`,
            );
          }

          if (packageJson.version !== manifest.version) {
            throw new Error(
              `package.json version "${packageJson.version}" must match manifest.json version "${manifest.version}".`,
            );
          }

          if (versions[manifest.version] !== manifest.minAppVersion) {
            throw new Error(
              `versions.json must map ${manifest.version} to minAppVersion ${manifest.minAppVersion}.`,
            );
          }
          NODE

      - name: Check types
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build release assets
        run: npm run build

      - name: Verify release assets
        run: test -f main.js && test -f manifest.json && test -f styles.css

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            main.js manifest.json styles.css \
            --verify-tag \
            --title "$TAG_NAME" \
            --generate-notes
